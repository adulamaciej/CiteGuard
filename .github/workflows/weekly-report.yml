name: Weekly CiteGuard Quality Report

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download report from live API
        run: |
          curl -X GET "https://citeguard-api-fdc5hxd0asbhbhee.polandcentral-01.azurewebsites.net/export/excel" \
            -o citeguard_results.xlsx

      - name: Move report into reports folder
        run: |
          mkdir -p reports
          mv citeguard_results.xlsx "reports/citeguard_results_$(date +%Y-%m-%d).xlsx"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/*.xlsx

      - name: Commit report to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add reports/
          git commit -m "Add weekly quality report [skip ci]" || echo "No changes to commit"
          git push